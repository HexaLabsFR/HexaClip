# Construit HexaClip.exe sur un Windows de GitHub et publie une version quand VERSION change dans src/hexaclip.py.
# 1. fabrique l'exe  2. le vérifie (--selftest : détection, Faceit, enregistrement simulé et compil TikTok)
# 3. le publie dans les Releases (dépôt privé)
name: Construire et publier HexaClip

on:
  push:
    branches: [main, "correctif-*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publier
  cancel-in-progress: false

jobs:
  construire:
    runs-on: windows-latest
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Lire la version
        id: v
        run: |
          V=$(python -c "import re;print(re.search(r'^VERSION = \"([0-9.]+)\"', open('src/hexaclip.py', encoding='utf-8').read(), re.M).group(1))")
          echo "version=$V" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$V" >/dev/null; then
            echo "nouvelle=false" >> "$GITHUB_OUTPUT"
            echo "La version $V est déjà publiée : l'exe est construit pour vérification, sans nouvelle Release."
          else
            echo "nouvelle=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-go@v5
        with:
          go-version: "1.24"
          cache: false

      - name: Fabriquer l'outil d'analyse des démos
        working-directory: outils/analyse_demo
        run: |
          go mod tidy
          mkdir -p ../../src/bin
          go build -trimpath -ldflags "-s -w" -o ../../src/bin/analyse_demo.exe .
          ls -la ../../src/bin

      - name: Récupérer le module de rendu CS2 (CS Demo Manager, licence MIT)
        run: |
          # version figée du module (vérifiée) + correctif HexaClip pour CS2 1.41.7.6+ (ticket CSDM n° 1458)
          git init -q ext/csdm
          cd ext/csdm
          git remote add origin https://github.com/akiver/cs-demo-manager
          git fetch -q --depth 1 origin fc2b5bde25991ff299f5bda8acef4db5e70f4482
          git checkout -q FETCH_HEAD
          git submodule update --init cs2-server-plugin/cs2-server-plugin/deps/hl2sdk cs2-server-plugin/cs2-server-plugin/deps/json cs2-server-plugin/cs2-server-plugin/deps/easywsclient
          git log -1 --format="CS Demo Manager %h (%cs)"
          python ../../outils/module_cs2/corriger_module.py cs2-server-plugin/cs2-server-plugin/main.cpp

      - uses: microsoft/setup-msbuild@v2

      - name: Fabriquer le module de rendu CS2
        shell: pwsh
        run: |
          Push-Location ext/csdm/cs2-server-plugin
          msbuild /m /v:minimal /p:Configuration=Release /p:Platform=x64 cs2-server-plugin.sln
          if ($LASTEXITCODE -ne 0) { exit 1 }
          Pop-Location
          New-Item -ItemType Directory -Force src/bin/cs2 | Out-Null
          Copy-Item ext/csdm/static/cs2/server.dll src/bin/cs2/server.dll
          Copy-Item ext/csdm/LICENSE src/bin/cs2/LICENCE-CS-Demo-Manager.txt
          Get-ChildItem src/bin/cs2

      - name: Installer les modules
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r build/requirements-build.txt

      - name: Fabriquer HexaClip.exe
        env:
          V: ${{ steps.v.outputs.version }}
        run: |
          python build/version_info.py "$V" > build/version_info.txt
          pyinstaller --noconfirm --clean --distpath dist --workpath build/work build/HexaClip.spec
          ls -la dist

      - name: Préparer FFmpeg pour la vérification
        shell: pwsh
        run: |
          Invoke-WebRequest -Uri "https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip" -OutFile ffmpeg.zip
          Expand-Archive ffmpeg.zip -DestinationPath ffmpeg_test
          $bin = (Get-ChildItem -Path ffmpeg_test -Recurse -Filter ffmpeg.exe | Select-Object -First 1).DirectoryName
          "HEXACLIP_FFMPEG=$bin" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          & "$bin\ffmpeg.exe" -hide_banner -version | Select-Object -First 1
          & "$bin\ffmpeg.exe" -hide_banner -filters | Select-String "ddagrab|drawtext|gblur|xfade|rgbashift|fillborders"

      - name: Vérifier l'exe
        shell: pwsh
        run: |
          $env:HEXACLIP_DATA = "$env:RUNNER_TEMP\hexaclip_data"
          $p = Start-Process -FilePath "dist\HexaClip.exe" -ArgumentList "--selftest","--out","selftest.txt" -Wait -PassThru
          Get-Content selftest.txt -Encoding utf8
          # lignes en échec remontées en annotations (lisibles sans ouvrir le journal)
          Get-Content selftest.txt -Encoding utf8 | Where-Object { $_ -match "ERREUR|MANQUANTE|Bilan|Traceback|Error|@ 0|Parsed_|refus" } | Select-Object -First 40 | ForEach-Object {
            $l = $_ -replace '%', '%25' -replace "`r", '' ; if ($l -match "Bilan") { Write-Host "::notice::$l" } else { Write-Host "::error::$l" } }
          if ($p.ExitCode -ne 0) { Write-Error "Code de sortie $($p.ExitCode)"; exit 1 }
          $t = Get-Content selftest.txt -Raw -Encoding utf8
          if ($t -match "ERREUR|MANQUANTE") { Write-Error "Vérification en échec"; exit 1 }
          if ($t -notmatch "compil TikTok automatique : OK" -or $t -notmatch "compil avec les kills choisis : OK" -or $t -notmatch "démo : passage calculé encodé et rangé comme un clip : OK" -or $t -notmatch "démo : module de rendu CS2 livré : OK") { Write-Error "La compil de test n'a pas été montée"; exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: HexaClip-${{ steps.v.outputs.version }}
          path: dist/HexaClip.exe

      - name: Publier la version (GitHub Release)
        if: steps.v.outputs.nouvelle == 'true' && github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
          V: ${{ steps.v.outputs.version }}
        run: |
          if [ -s NOUVEAUTES.txt ]; then cp NOUVEAUTES.txt notes.txt; else git log -1 --pretty=%s > notes.txt; fi
          cp dist/HexaClip.exe "dist/HexaClip-$V.exe"
          gh release create "v$V" "dist/HexaClip.exe" "dist/HexaClip-$V.exe" --title "HexaClip $V" --notes-file notes.txt
